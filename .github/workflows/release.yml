name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 'Android Stream Desk ${{ steps.tag.outputs.value }}'
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full release notes.
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows (.msi/.exe)
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'Android Stream Desk ${{ needs.create-release.outputs.tag }}'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi

  build-android:
    name: Build Android (.apk)
    needs: create-release
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Tauri Android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: pnpm tauri android init

      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d \
            > src-tauri/gen/android/app/release.keystore

      - name: Create keystore.properties
        if: env.KEYSTORE_B64 != ''
        run: |
          cat > src-tauri/gen/android/app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: pnpm tauri android build --apk

      - name: Upload signed APK to release
        if: env.KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

      - name: Upload unsigned APK to release (fallback when no signing secrets)
        if: env.KEYSTORE_B64 == ''
        run: echo "⚠ ANDROID_KEYSTORE_BASE64 secret not set — uploading unsigned APK"
      - name: Upload unsigned APK
        if: env.KEYSTORE_B64 == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

  update-manifest:
    name: Refresh updater manifest
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows updater signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          mkdir -p download
          VERSION="${TAG#v}"
          SIG_URL=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".msi.sig")) | .url' | head -n1)
          MSI_URL=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".msi")) | .url' | head -n1)
          if [ -z "$SIG_URL" ] || [ -z "$MSI_URL" ]; then
            echo "Missing Windows release assets — skipping manifest update."
            exit 0
          fi
          SIG_CONTENT=$(curl -sL -H "Authorization: token $GH_TOKEN" "$SIG_URL")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > download/latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Android Stream Desk $TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG_CONTENT",
                "url": "$MSI_URL"
              }
            }
          }
          EOF

      - name: Commit manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download/latest.json
          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi
          git commit -m "chore(release): update updater manifest for ${TAG}"
          git push
