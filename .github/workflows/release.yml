name: Release

# Tag conventions:
#   v*        → build Windows + Android (full release)
#   v*-win    → build Windows only
#   v*-apk    → build Android only

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      release_id: ${{ steps.create-release.outputs.id }}
      build_windows: ${{ steps.flags.outputs.build_windows }}
      build_android: ${{ steps.flags.outputs.build_android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set build flags from tag suffix
        id: flags
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-apk ]]; then
            echo "build_windows=false" >> "$GITHUB_OUTPUT"
            echo "build_android=true"  >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-win ]]; then
            echo "build_windows=true"  >> "$GITHUB_OUTPUT"
            echo "build_android=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_windows=true"  >> "$GITHUB_OUTPUT"
            echo "build_android=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 'Android Stream Desk ${{ steps.tag.outputs.value }}'
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full release notes.
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows (.msi/.exe)
    needs: create-release
    if: ${{ needs.create-release.outputs.build_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup MSVC environment (vcvarsall → PATH/INCLUDE/LIB)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Override broken CC/CXX env vars (runner image sets them to paths with spaces)
        shell: bash
        run: |
          # cc-rs splits env var values on spaces: "C:\Program Files\..." -> tries "C:\Program"
          # ilammy added the real MSVC bin to PATH so bare names resolve correctly.
          echo "CC_x86_64-pc-windows-msvc=cl.exe"  >> "$GITHUB_ENV"
          echo "CXX_x86_64-pc-windows-msvc=cl.exe" >> "$GITHUB_ENV"
          echo "AR_x86_64-pc-windows-msvc=lib.exe"  >> "$GITHUB_ENV"

      - name: Create BuildTools→Enterprise junction for cargo linker path
        shell: pwsh
        run: |
          # cargo reads MSVC linker path from Windows registry → points to BuildTools which
          # doesn't have link.exe. Create a junction so the registry path resolves to Enterprise.
          $buildTools = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"
          $enterprise  = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          if (-not (Test-Path $enterprise)) {
            Write-Host "Enterprise not found at $enterprise — skipping junction"; exit 0
          }
          if (Test-Path $buildTools) {
            Write-Host "BuildTools already exists — no junction needed"; exit 0
          }
          New-Item -ItemType Junction -Path $buildTools -Target $enterprise -Force | Out-Null
          Write-Host "Junction: $buildTools -> $enterprise"

      - name: Build + upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'Android Stream Desk ${{ needs.create-release.outputs.tag }}'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi

  build-android:
    name: Build Android (.apk)
    needs: create-release
    if: ${{ needs.create-release.outputs.build_android == 'true' }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # arm64-v8a + armeabi-v7a only — x86/x86_64 are emulator-only targets
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Tauri Android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: pnpm tauri android init

      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d \
            > src-tauri/gen/android/app/release.keystore

      - name: Create keystore.properties
        if: env.KEYSTORE_B64 != ''
        run: |
          cat > src-tauri/gen/android/app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: pnpm tauri android build --apk

      - name: Upload signed APK to release
        if: env.KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/android-stream-desk-v*.apk

      - name: Upload unsigned APK to release (fallback when no signing secrets)
        if: env.KEYSTORE_B64 == ''
        run: echo "⚠ ANDROID_KEYSTORE_BASE64 secret not set — uploading unsigned APK"
      - name: Upload unsigned APK
        if: env.KEYSTORE_B64 == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/android-stream-desk-v*-unsigned.apk

  update-manifest:
    name: Refresh updater manifest
    needs: [create-release, build-windows]
    if: ${{ needs.create-release.outputs.build_windows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows updater signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          mkdir -p download
          VERSION="${TAG#v}"
          SIG_URL=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".msi.sig")) | .url' | head -n1)
          MSI_URL=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".msi")) | .url' | head -n1)
          if [ -z "$SIG_URL" ] || [ -z "$MSI_URL" ]; then
            echo "Missing Windows release assets — skipping manifest update."
            exit 0
          fi
          SIG_CONTENT=$(curl -sL -H "Authorization: token $GH_TOKEN" "$SIG_URL")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > download/latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Android Stream Desk $TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG_CONTENT",
                "url": "$MSI_URL"
              }
            }
          }
          EOF

      - name: Commit manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download/latest.json
          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi
          git commit -m "chore(release): update updater manifest for ${TAG}"
          git push
